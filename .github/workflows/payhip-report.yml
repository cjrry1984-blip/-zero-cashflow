name: Daily Payhip report
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: payhip-daily-report
  cancel-in-progress: false
jobs:
  report:
    if: vars.PAYHIP_REPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch aggregate report
        env:
          PAYHIP_WORKER_URL: ${{ vars.PAYHIP_WORKER_URL }}
          PAYHIP_REPORT_TOKEN: ${{ secrets.PAYHIP_REPORT_TOKEN }}
        run: node automation/report.mjs

name: Render social image
on:
  push:
    paths:
      - 'social/*.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Render Instagram images
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for source in Path("social").glob("*.svg"):
              cairosvg.svg2png(url=str(source),write_to=str(source.with_suffix(".png")))
          PY
      - name: Publish PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Render social assets for campaign"
            git push
          fi

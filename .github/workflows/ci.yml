name: Validate ZERO CASHFLOW
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_data.py
      - run: python scripts/check_sales_pages.py
      - run: node scripts/test_checkout_route.mjs
      - run: python scripts/generate_weekly.py